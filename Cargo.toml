[workspace]
resolver = "2"
members = ["crates/converter", "crates/engine", "crates/launcher", "crates/shared"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["OpenSkyrim Team"]

[workspace.dependencies]
# Engine & Rendering
bevy = { version = "0.19.0", features = ["dynamic_linking"] }
wgpu = "24.0"

# Scripting & Database
mlua = { version = "0.10", features = ["luau", "luau-jit", "vendored"] }
rusqlite = { version = "0.32", features = ["bundled-full"] }
rkyv = { version = "0.8.18" }
memmap2 = "0.9"

# Error Handling
color-eyre = "0.6.5"

# Converter Dependencies
mesh-tools = "0.4.0"
basis-universal = "0.3"
ddsfile = "0.5"
nom = "8.0.0"

# Workspace profile optimization
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
