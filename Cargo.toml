[workspace]
resolver = "2"
members = [
    "crates/openskyrim_converter",
    "crates/openskyrim_engine",
    "crates/openskyrim_launcher",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["OpenSkyrim Team"]

[workspace.dependencies]
# Engine & Rendering
bevy = { version = "0.19.0", features = ["dynamic_linking"] }
wgpu = "24.0"

# Scripting & Database
mlua = { version = "0.10", features = ["luau", "luau-jit", "vendored"] }
libsql = "0.6"
rkyv = "0.8"
memmap2 = "0.9"

# Converter Dependencies
mesh-tools = "0.1"
basis-universal = "0.3"
ddsfile = "0.5"
nom = "8.0"

# Workspace profile optimization
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
