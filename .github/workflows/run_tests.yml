name: run_tests

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'
  RUSTUP_TOOLCHAIN: stable
  RUSTFLAGS: "-C debuginfo=0"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: ${{ github.ref == 'refs/heads/main' && 2 || 350 }}

      - id: filter
        name: Filter changed files
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_BASE_REF:-}" ]; then
            echo "Not in a PR context (i.e., push event)"
            COMPARE_REV="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          else
            echo "In a PR context comparing to pull_request.base.ref"
            git fetch origin "$GITHUB_BASE_REF" --depth=350
            COMPARE_REV="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)"
          fi

          if [ "$COMPARE_REV" = "$GITHUB_SHA" ]; then
            CHANGED_FILES="$(git diff --name-only HEAD~1 "$GITHUB_SHA" 2>/dev/null || git ls-files)"
          else
            CHANGED_FILES="$(git diff --name-only "$COMPARE_REV" "$GITHUB_SHA")"
          fi

          check_pattern() {
            local output_name="$1"
            local pattern="$2"

            if echo "$CHANGED_FILES" | grep -qE "$pattern"; then
              echo "${output_name}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${output_name}=false" >> "$GITHUB_OUTPUT"
            fi
          }

          check_pattern "check_rust" '^(Cargo\.lock|Cargo\.toml|.*\.rs|\.cargo/.*|\.github/workflows/.*)$'
    outputs:
      check_rust: ${{ steps.filter.outputs.check_rust }}

  format:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

  clippy:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      - name: Setup kache compiler cache
        uses: kunobi-ninja/kache-action@v1

      - name: Clippy check
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      - name: Setup kache compiler cache
        uses: kunobi-ninja/kache-action@v1

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Run unit & integration tests
        run: cargo nextest run --workspace --all-targets --no-fail-fast --no-tests=warn
        env:
          NEXTEST_NO_TESTS: warn

  tests_pass:
    needs:
      - orchestrate
      - format
      - clippy
      - test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify overall pipeline status
        run: |
          EXIT_CODE=0

          check_result() {
            local job_name="$1"
            local result="$2"
            echo "* ${job_name}: ${result}"
            if [[ "$result" != "skipped" && "$result" != "success" ]]; then
              EXIT_CODE=1
            fi
          }

          check_result "orchestrate" "$RESULT_ORCHESTRATE"
          check_result "format" "$RESULT_FORMAT"
          check_result "clippy" "$RESULT_CLIPPY"
          check_result "test" "$RESULT_TEST"

          exit $EXIT_CODE
        env:
          RESULT_ORCHESTRATE: ${{ needs.orchestrate.result }}
          RESULT_FORMAT: ${{ needs.format.result }}
          RESULT_CLIPPY: ${{ needs.clippy.result }}
          RESULT_TEST: ${{ needs.test.result }}
  
