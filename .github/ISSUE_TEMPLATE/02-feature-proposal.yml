name: 💡 Feature Proposal
description: Propose a new feature, architecture enhancement, or new capability.
title: "[Feature]: "
labels: ["enhancement", "needs-discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing a feature for **OpenSkyrim**! 
        Before submitting, please review existing specifications in [`docs/specs/`](https://github.com/realfakenerd/OpenSkyrim/tree/main/docs/specs).

  - type: input
    id: feature-title
    attributes:
      label: Feature Name / Headline
      placeholder: e.g., Support multi-threaded mesh loading in engine
    validations:
      required: true

  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? Please describe it clearly.
      placeholder: e.g., Currently, asset conversion blocks the render thread when entering a new cell...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution & Architectural Impact
      description: Describe the solution you'd like to see implemented and how it fits into existing crates (`engine`, `converter`, `launcher`).
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you've evaluated.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I checked existing issues and discussions to avoid duplicate proposals.
          required: true
        - label: This proposal aligns with OpenSkyrim's design goals and technical scope.
          required: true
